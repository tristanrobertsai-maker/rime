<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    @keyframes fade-rise {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-rise { opacity: 0; animation: fade-rise 0.8s ease-out forwards; }
    .animate-fade-rise-delay { opacity: 0; animation: fade-rise 0.8s ease-out 0.2s forwards; }
    .animate-fade-rise-delay-2 { opacity: 0; animation: fade-rise 0.8s ease-out 0.4s forwards; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Video background */
    .video-bg {
      position: absolute;
      top: 300px;
      inset: auto 0 0 0;
      z-index: 0;
    }
    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.1s linear;
    }
    .video-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #FFFFFF, transparent, #FFFFFF);
    }

    /* Container */
    .page-container {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      background: #FFFFFF;
    }

    /* Navigation */
    .navbar {
      position: relative;
      z-index: 10;
      max-width: 80rem;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Instrument Serif', serif;
      font-size: 1.875rem;
      letter-spacing: -0.025em;
      color: #000000;
      text-decoration: none;
    }
    .logo sup { font-size: 0.75rem; }
    .nav-links {
      display: none;
      align-items: center;
      gap: 2rem;
    }
    @media (min-width: 768px) {
      .nav-links { display: flex; }
    }
    .nav-links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      color: #6F6F6F;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { opacity: 0.7; }
    .nav-links a.active { color: #000000; }
    .nav-cta {
      font-family: 'Inter', sans-serif;
      border-radius: 9999px;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      background-color: #000000;
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .nav-cta:hover { transform: scale(1.03); }

    /* Hero */
    .hero {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.5rem 10rem;
      padding-top: calc(8rem - 75px);
    }
    .hero h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      max-width: 80rem;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.95;
      letter-spacing: -2.46px;
      color: #000000;
    }
    .hero h1 .muted {
      color: #6F6F6F;
    }
    .hero p {
      font-size: clamp(1rem, 2vw, 1.125rem);
      max-width: 42rem;
      margin-top: 2rem;
      line-height: 1.625;
      color: #6F6F6F;
    }
    .hero-cta {
      font-family: 'Inter', sans-serif;
      border-radius: 9999px;
      padding: 1.25rem 3.5rem;
      font-size: 1rem;
      font-weight: 500;
      margin-top: 3rem;
      background-color: #000000;
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .hero-cta:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- Video Background -->
    <div class="video-bg">
      <video id="bgVideo" muted playsinline preload="auto">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260325_094440_a3592600-bd1e-49e5-9bce-a73662061d83.mp4" type="video/mp4" />
      </video>
      <div class="video-gradient"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
      <a href="#" class="logo">RIME</a>
      <div class="nav-links">
        <a href="#" class="active">Community</a>
        <a href="#">X</a>
      </div>
      <a href="#" class="nav-cta">Access Terminal</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
      <h1 class="animate-fade-rise">
        Beyond <span class="muted">silence,</span> we build <span class="muted">the eternal.</span>
      </h1>
      <p class="animate-fade-rise-delay">
        Building platforms for brilliant minds, fearless makers, and thoughtful souls.
        Through the noise, we craft digital havens for deep work and pure flows.
      </p>
      <a href="#" class="hero-cta animate-fade-rise-delay-2">Access Terminal</a>
    </section>
  </div>

  <script>
    (function() {
      const video = document.getElementById('bgVideo');
      const FADE_DURATION = 0.5;
      let animationId;

      function checkFade() {
        const ct = video.currentTime;
        const dur = video.duration;
        if (isNaN(dur) || dur === 0) { animationId = requestAnimationFrame(checkFade); return; }
        if (ct < FADE_DURATION) { video.style.opacity = String(ct / FADE_DURATION); }
        else if (ct > dur - FADE_DURATION) { video.style.opacity = String((dur - ct) / FADE_DURATION); }
        else { video.style.opacity = '1'; }
        animationId = requestAnimationFrame(checkFade);
      }

      video.addEventListener('ended', function() {
        video.style.opacity = '0';
        setTimeout(function() { video.currentTime = 0; video.play(); }, 100);
      });

      video.addEventListener('canplay', function() {
        video.play();
        animationId = requestAnimationFrame(checkFade);
      }, { once: true });

      video.play().catch(function() {});
    })();
  </script>
</body>
</html>
